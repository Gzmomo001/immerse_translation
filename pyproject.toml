[project]
name = "ai-dubbing-warehouse"
version = "0.1.0"
description = "AI Video Dubbing Warehouse - 将英文视频转换为中文配音"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "AI Dubbing Team"}
]
dependencies = [
    # Core AI and DSP libraries - 使用平台特定版本
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",

    # Module 1: Source Separation
    "audio-separator>=0.12.0",

    # Module 2: Transcription
    "whisperx @ git+https://github.com/m-bain/whisperx.git",

    # Module 3: LLM Director
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Module 4: TTS Engine
    "modelscope>=1.9.0",
    "funasr>=1.0.0",

    # Module 5: Post-Processing
    "ffmpeg-python>=0.2.0",
    "pydub>=0.25.0",

    # Async & Utilities
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

# 平台特定的 PyTorch 源配置
# macOS 使用默认 PyPI (CPU/MPS 版本)
# Linux CUDA 用户需要手动安装: uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu118
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'darwin' or sys_platform == 'win32'" }
torchaudio = { index = "pytorch-cpu", marker = "sys_platform == 'darwin' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

# 代码质量工具配置
[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
