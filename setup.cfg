[metadata]
name = ai-video-dubbing
version = 0.1.0
author = Your Name
author_email = your.email@example.com
description = AI Video Dubbing Warehouse - 将英文视频转换为中文配音
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourusername/ai-video-dubbing
project_urls =
    Bug Tracker = https://github.com/yourusername/ai-video-dubbing/issues
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    torch>=2.0.0
    torchaudio>=2.0.0
    librosa>=0.10.0
    soundfile>=0.12.0
    numpy>=1.24.0
    audio-separator>=0.12.0
    whisperx @ git+https://github.com/m-bain/whisperx.git
    openai>=1.0.0
    pydantic>=2.0.0
    pydantic-settings>=2.0.0
    modelscope>=1.9.0
    funasr>=1.0.0
    ffmpeg-python>=0.2.0
    pydub>=0.25.0
    aiohttp>=3.9.0
    python-dotenv>=1.0.0

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-asyncio>=0.21.0
    pytest-cov>=4.0.0
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.0.0
    mypy>=1.0.0
    pre-commit>=3.0.0

[options.entry_points]
console_scripts =
    ai-dubbing = ai_dubbing.cli:main

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True

[isort]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
